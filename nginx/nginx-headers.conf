## Quick Setup Steps:

1. Create first proxy host for crypt.secsols.dev
2. Copy-paste the main domain config into Advanced tab
3. Create second proxy host for cryptsandbox.secsols.dev  
4. Copy-paste the sandbox domain config into Advanced tab
5. Save both configurations
6. Test both domains

